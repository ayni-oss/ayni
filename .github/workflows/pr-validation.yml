name: PR Validation

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

concurrency:
  # One active validation run per PR; independent jobs start together.
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  metadata:
    name: Conventional title
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    steps:
      - name: Validate title
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = context.payload.pull_request.title.trim();
            const pattern = /^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(?:\(([a-z0-9][a-z0-9._/-]*)\))?(!)?: \S(?:.*\S)?$/;
            if (!pattern.test(title)) {
              core.setFailed(`PR title must match Conventional Commits; received: ${title}`);
            }

  cncf:
    name: CNCF requirements
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: |
          test -f SECURITY.md
          test -f CONTRIBUTING.md
          test -f CODE_OF_CONDUCT.md
          test -f GOVERNANCE.md
          test -f MAINTAINERS.md
          test -f ROADMAP.md
          test -f .github/dco.yml

  product:
    name: Product integration checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          components: rustfmt, clippy
      - name: Validate the repository
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features
          python3 scripts/ci/validate_release_workflow.py
          python3 -m unittest discover -s scripts/ci -p test_release_executor.py

  ayni:
    name: Ayni repository contract
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Build the PR CLI and executor
        id: candidate
        env:
          PLATFORM: linux/amd64
          SOURCE: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          scripts/ci/build-candidate.sh .ayni/ci-candidate "$PLATFORM"
          docker run --detach --rm --name ayni-local-registry --publish 127.0.0.1:5000:5000 registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:5000/v2/ >/dev/null && break
            sleep 1
          done
          python3 scripts/ci/candidate.py import --directory .ayni/ci-candidate --source "$SOURCE" --platform "$PLATFORM" --run-id "$GITHUB_RUN_ID"
      - name: Build and use the repository environment
        env:
          AYNI: ${{ steps.candidate.outputs.cli }}
          EXECUTOR: ${{ steps.candidate.outputs.executor }}
        run: |
          set -euo pipefail
          "$AYNI" env build --repo-root . --executor-image "$EXECUTOR"
          image="$(jq --raw-output .image_tag .ayni/environment/build.json)"
          docker run --rm --user "$(id -u):$(id -g)" \
            --env HOME=/tmp/home \
            --env XDG_CACHE_HOME=/tmp/cache \
            --env MISE_CACHE_DIR=/tmp/mise \
            --env CARGO_HOME=/tmp/cargo \
            --env CARGO_TARGET_DIR=/tmp/target \
            --env npm_config_cache=/tmp/npm \
            --env GRADLE_USER_HOME=/tmp/gradle \
            --env UV_CACHE_DIR=/tmp/uv \
            --mount "type=bind,source=$PWD,target=/workspace" \
            --workdir /workspace \
            "$image" ayni check --config .ayni.toml --output markdown | tee "$RUNNER_TEMP/ayni.md"
      - name: Upload Ayni JSON evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ayni-pr-evidence
          path: .ayni/last/signals.json
          if-no-files-found: warn
          retention-days: 1

      - name: Upload Ayni report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ayni-pr-report
          path: ${{ runner.temp }}/ayni.md
          if-no-files-found: warn
          retention-days: 1

  report:
    name: Ayni PR comment
    needs: ayni
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - name: Download Ayni report
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ayni-pr-report
          path: ${{ runner.temp }}/ayni-report

      - name: Create or update Ayni comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REPORT_PATH: ${{ runner.temp }}/ayni-report/ayni.md
          AYNI_RESULT: ${{ needs.ayni.result }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ayni-signals -->';
            const result = process.env.AYNI_RESULT;
            const status = result === 'success' ? 'passed' : result;
            let report = 'Ayni did not produce a report. See the workflow log for details.\n';
            if (fs.existsSync(process.env.REPORT_PATH)) {
              report = fs.readFileSync(process.env.REPORT_PATH, 'utf8');
            }
            if (report.length > 60_000) {
              report = `${report.slice(0, 60_000)}\n\n_Report truncated; see the workflow log for the full result._\n`;
            }
            const body = `${marker}\n## Ayni: ${status}\n\n${report}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) => comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  complete:
    name: Required completion
    if: ${{ !cancelled() }}
    needs: [metadata, cncf, product, ayni]
    runs-on: ubuntu-24.04
    steps:
      - run: |
          test '${{ needs.metadata.result }}' = success
          test '${{ needs.cncf.result }}' = success
          test '${{ needs.product.result }}' = success
          test '${{ needs.ayni.result }}' = success
