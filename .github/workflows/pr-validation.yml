name: PR Validation

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

concurrency:
  # One active validation run per PR; independent jobs start together.
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  metadata:
    name: PR metadata
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    steps:
      - name: Validate title
        uses: ayni-oss/ayni/.github/actions/pr-metadata@82966446499f11f5668dd314a432c8ab74788c3d # shared CI

  cncf:
    name: Project requirements
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify required project files
        uses: ./.github/actions/project-files

  documentation:
    name: Documentation
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up locked documentation dependencies
        uses: ./.github/actions/node-project
        with:
          package-manager: npm
          node-version: 22.12.0
      - run: node --test scripts/ci/test-shared-actions.cjs
      - run: npm run docs:check

  product:
    name: Tests and tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          components: rustfmt, clippy
      - name: Validate the repository
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features
          python3 scripts/ci/validate_release_workflow.py
          python3 scripts/ci/validate_workflow_pins.py
          python3 -m unittest discover -s scripts/ci -p test_release_executor.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s .github/actions/managed-check -p 'test_*.py'

  ayni:
    name: Ayni quality
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Initialize report
        run: printf 'Ayni did not produce a report. See the workflow log for details.\n' > "$RUNNER_TEMP/ayni.md"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Build the PR CLI and executor
        id: candidate
        env:
          PLATFORM: linux/amd64
          SOURCE: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          scripts/ci/build-candidate.sh .ayni/ci-candidate "$PLATFORM"
          docker run --detach --rm --name ayni-local-registry --publish 127.0.0.1:5000:5000 registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:5000/v2/ >/dev/null && break
            sleep 1
          done
          python3 scripts/ci/candidate.py import --directory .ayni/ci-candidate --source "$SOURCE" --platform "$PLATFORM" --run-id "$GITHUB_RUN_ID"
      - name: Reuse or build the locked repository environment
        uses: ./.github/actions/managed-check
        with:
          cli: ${{ steps.candidate.outputs.cli }}
          executor-image: ${{ steps.candidate.outputs.executor }}
          repository: ${{ github.repository }}
      - name: Upload Ayni JSON evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ayni-pr-evidence
          path: .ayni/last/signals.json
          if-no-files-found: warn
          retention-days: 1

      - name: Upload Ayni report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ayni-pr-report
          path: ${{ runner.temp }}/ayni.md
          if-no-files-found: warn
          retention-days: 1

  report:
    name: Ayni report
    needs: ayni
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - name: Create or update Ayni comment
        uses: ayni-oss/ayni/.github/actions/quality-report@82966446499f11f5668dd314a432c8ab74788c3d # shared CI
        with:
          result: ${{ needs.ayni.result }}

  complete:
    name: CI result
    if: ${{ !cancelled() }}
    needs: [metadata, cncf, documentation, product, ayni]
    runs-on: ubuntu-24.04
    steps:
      - run: |
          test '${{ needs.metadata.result }}' = success
          test '${{ needs.cncf.result }}' = success
          test '${{ needs.documentation.result }}' = success
          test '${{ needs.product.result }}' = success
          test '${{ needs.ayni.result }}' = success
