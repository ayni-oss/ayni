name: Ayni PR report

on:
  workflow_run:
    workflows: [PR Validation]
    types: [completed]

permissions: {}

jobs:
  report:
    name: Update Ayni PR comment
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled' &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Download Ayni report
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ayni-pr-evidence
          run-id: ${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/ayni-report
          github-token: ${{ github.token }}

      - name: Create or update Ayni comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REPORT_PATH: ${{ runner.temp }}/ayni-report/ayni.md
          WORKFLOW_RESULT: ${{ github.event.workflow_run.conclusion }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ayni-signals -->';
            const result = process.env.WORKFLOW_RESULT;
            const status = result === 'success' ? 'passed' : result;
            let report = 'Ayni did not produce a report. See the workflow log for details.\n';
            if (fs.existsSync(process.env.REPORT_PATH)) {
              report = fs.readFileSync(process.env.REPORT_PATH, 'utf8');
            }
            if (report.length > 60_000) {
              report = `${report.slice(0, 60_000)}\n\n_Report truncated; see the workflow log for the full result._\n`;
            }
            const body = `${marker}\n## Ayni: ${status}\n\n${report}`;
            const issue_number = Number(process.env.PR_NUMBER);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) => comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }
