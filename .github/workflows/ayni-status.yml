name: ayni-status

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  signals:
    name: ayni signals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          components: llvm-tools-preview

      - name: Cache host signal tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ayni-host/bin
          key: ayni-host-tools-v1-cargo-llvm-cov-0.8.5-rust-code-analysis-cli-0.0.25

      - name: Install host signal tools
        run: |
          set -euo pipefail
          install_root="$HOME/.cache/ayni-host"
          export PATH="$install_root/bin:$PATH"
          command -v cargo-llvm-cov >/dev/null || cargo install --locked --root "$install_root" cargo-llvm-cov --version 0.8.5
          command -v rust-code-analysis-cli >/dev/null || cargo install --locked --root "$install_root" rust-code-analysis-cli --version 0.0.25
          echo "$install_root/bin" >> "$GITHUB_PATH"

      - name: Run Ayni host signals
        id: signals
        run: |
          set +e
          cargo run --locked -p ayni-cli -- check --host --config ./.ayni.toml --output markdown > "$RUNNER_TEMP/ayni-signals.md"
          exit_code=$?
          set -e
          test -s "$RUNNER_TEMP/ayni-signals.md" || printf '## Ayni signals\n\nAyni exited before producing a report.\n' > "$RUNNER_TEMP/ayni-signals.md"
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

      - name: Publish Ayni signal results
        if: ${{ always() && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REPORT_PATH: ${{ runner.temp }}/ayni-signals.md
          EXIT_CODE: ${{ steps.signals.outputs.exit_code }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ayni-signals -->';
            const status = process.env.EXIT_CODE === '0' ? 'passed' : 'failed';
            let report = fs.readFileSync(process.env.REPORT_PATH, 'utf8');
            if (report.length > 60000) {
              report = `${report.slice(0, 60000)}\n\n_Report truncated; see the workflow log for the full result._\n`;
            }
            const body = `${marker}\n## Ayni signals: ${status}\n\n${report}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail when Ayni finds signal failures
        if: ${{ steps.signals.outputs.exit_code != '0' }}
        run: exit 1
