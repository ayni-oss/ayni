name: publish release binaries

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      version:
        required: true
        type: string
      commit:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    permissions:
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build and verify tagged Ayni version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(cargo metadata --locked --no-deps --format-version 1 | jq --raw-output '.packages[] | select(.name == "ayni-cli") | .version')"
          test "$package_version" = "$EXPECTED_VERSION"
          if [[ "$TARGET" == *linux-gnu ]]; then
            source .github/docker/ayni-env.versions
            docker run --rm --user "$(id -u):$(id -g)" \
              --env CARGO_HOME=/tmp/cargo --volume "$PWD:/workspace" --workdir /workspace \
              "$RUST_BUILDER_IMAGE" cargo build --locked -p ayni-cli --release --target "$TARGET"
          else
            cargo build --locked -p ayni-cli --release --target "$TARGET"
          fi
          test "$("target/${TARGET}/release/ayni" --version)" = "ayni ${EXPECTED_VERSION}"

      - name: Package binary
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist "dist/ayni-${TAG}-${TARGET}"
          cp "target/${TARGET}/release/ayni" "dist/ayni-${TAG}-${TARGET}/"
          cp LICENSE "dist/ayni-${TAG}-${TARGET}/"
          archive="ayni-${TAG}-${TARGET}.tar.gz"
          tar -C dist -czf "dist/${archive}" "ayni-${TAG}-${TARGET}"
          shasum -a 256 "dist/${archive}" > "dist/${archive}.sha256"

      - name: Attest release archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Checkout workflow helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify release tag identifies the source
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          EXPECTED_COMMIT: ${{ inputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          sha="$(python3 scripts/ci/release_artifacts.py source --tag "$TAG")"
          test "$sha" = "$EXPECTED_COMMIT"

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist

      - name: Build checksum manifest
        env:
          TAG: ${{ inputs.tag }}
        run: python3 scripts/ci/release_artifacts.py checksums --tag "$TAG" --directory dist

      - name: Create publication app token
        id: publication-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Upload release archives with overwrite recovery
        env:
          GH_TOKEN: ${{ steps.publication-token.outputs.token }}
          TAG: ${{ inputs.tag }}
          EXPECTED_COMMIT: ${{ inputs.commit }}
        run: python3 scripts/ci/release_artifacts.py upload --tag "$TAG" --expected-source "$EXPECTED_COMMIT" --directory dist
