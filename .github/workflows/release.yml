name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Ayni release tag whose binary assets should be rebuilt
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    concurrency:
      group: release-metadata
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      release_created: ${{ steps.release-metadata.outputs.release_created }}
      release_tag: ${{ steps.release-metadata.outputs.tag }}
      release_version: ${{ steps.release-metadata.outputs.version }}
      release_commit: ${{ steps.release-source.outputs.commit }}
      release_pr_available: ${{ steps.release-pr.outputs.available }}
      release_pr_branch: ${{ steps.release-pr.outputs.branch }}

    steps:
      - name: Checkout workflow helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create release app token
        id: app-token
        if: ${{ github.event_name == 'push' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Run release
        id: release
        if: ${{ github.event_name == 'push' }}
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Resolve existing release metadata
        id: manual-release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          WORKFLOW_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          test "$WORKFLOW_REF" = "refs/heads/main"
          if [[ ! "$RELEASE_TAG" =~ ^ayni-v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "release_tag must match ayni-v<semver>" >&2
            exit 1
          fi
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          test "$(jq --raw-output '.draft' <<<"$release")" = "false"
          test "$(jq --raw-output '.tag_name' <<<"$release")" = "$RELEASE_TAG"
          {
            echo "release_created=true"
            echo "tag=$RELEASE_TAG"
            echo "version=${RELEASE_TAG#ayni-v}"
          } >> "$GITHUB_OUTPUT"

      - name: Normalize release metadata for publication
        id: release-metadata
        if: ${{ steps.manual-release.outputs.release_created == 'true' || steps.release.outputs.release_created == 'true' }}
        env:
          TAG: ${{ steps.manual-release.outputs.tag || steps.release.outputs.tag_name }}
          VERSION: ${{ steps.manual-release.outputs.version || steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERSION"
          test "$TAG" = "ayni-v${VERSION}"
          {
            echo "release_created=true"
            echo "tag=$TAG"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve immutable release source commit
        id: release-source
        if: ${{ steps.release-metadata.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release-metadata.outputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          sha="$(python3 scripts/ci/release_artifacts.py source --tag "$TAG")"
          test "$sha" != ""
          if [[ "$EVENT_NAME" == "push" ]]; then
            test "$sha" = "$TRIGGER_COMMIT"
          fi
          echo "commit=$sha" >> "$GITHUB_OUTPUT"

      - name: Resolve release pull request branch
        id: release-pr
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_PRS_CREATED: ${{ steps.release.outputs.prs_created }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        shell: bash
        run: |
          set -euo pipefail
          branch=""
          if [[ "$RELEASE_PRS_CREATED" == "true" ]]; then
            branch="$(jq --raw-output '.[0].headBranchName // empty' <<<"$RELEASE_PRS")"
          else
            mapfile -t branches < <(
              gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=100" \
                --jq '.[] | select(.head.ref | startswith("release-please--")) | .head.ref'
            )
            test "${#branches[@]}" -le 1
            branch="${branches[0]-}"
          fi
          if [[ -z "$branch" ]]; then
            exit 0
          fi
          {
            echo "available=true"
            echo "branch=$branch"
          } >> "$GITHUB_OUTPUT"

  sync-release-lock:
    name: Refresh release environment lock
    needs: release
    if: >-
      ${{
        always() &&
        needs.release.result == 'success' &&
        needs.release.outputs.release_pr_available == 'true'
      }}
    concurrency:
      group: release-pr-maintenance
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout release pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.release_pr_branch }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1

      - name: Regenerate Ayni lock deterministically
        run: |
          set -euo pipefail
          cargo run --locked -p ayni-cli -- env lock --repo-root .
          cp .ayni.lock "$RUNNER_TEMP/release-lock.first"
          cargo run --locked -p ayni-cli -- env lock --repo-root .
          cmp "$RUNNER_TEMP/release-lock.first" .ayni.lock

      - name: Commit Ayni lock
        env:
          BRANCH: ${{ needs.release.outputs.release_pr_branch }}
          GIT_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .ayni.lock; then
            exit 0
          fi
          git config user.name "ayni-release[bot]"
          git config user.email "282289292+ayni-release[bot]@users.noreply.github.com"
          git add -- .ayni.lock
          git commit -m "chore(release): refresh Ayni lock"
          git push "https://x-access-token:$GIT_TOKEN@github.com/$GITHUB_REPOSITORY.git" "HEAD:$BRANCH"

  publication:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    concurrency:
      group: release-publication-${{ needs.release.outputs.release_tag }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-publication.yml
    with:
      tag: ${{ needs.release.outputs.release_tag }}
      version: ${{ needs.release.outputs.release_version }}
      commit: ${{ needs.release.outputs.release_commit }}
    secrets: inherit
