name: Ayni pull request feedback
description: Download the quality report and update only the GitHub Actions bot comment
inputs:
  result:
    description: Result of the quality job
    required: true
  artifact-name:
    description: Uploaded Markdown report artifact
    default: ayni-pr-report
runs:
  using: composite
  steps:
    - name: Download Ayni report
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/ayni-report
    - name: Create or update Ayni comment
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
        REPORT_PATH: ${{ runner.temp }}/ayni-report/ayni.md
        AYNI_RESULT: ${{ inputs.result }}
      with:
        script: |
          const { publishReport } = require(`${process.env.ACTION_PATH}/report.cjs`);
          await publishReport({ github, context, reportPath: process.env.REPORT_PATH, result: process.env.AYNI_RESULT });
