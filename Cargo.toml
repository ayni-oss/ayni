[workspace]
members = [
  "core",
  "adapters/common",
  "adapters/go",
  "adapters/kotlin",
  "adapters/rust",
  "adapters/node",
  "adapters/python",
  "environment",
  "cli",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.93"
version = "0.13.0"
authors = ["Gastón Durand Vadas"]
description = "Open-source code quality signals for AI agents"
license = "Apache-2.0"
repository = "https://github.com/ayni-oss/ayni"
homepage = "https://github.com/ayni-oss/ayni"

[workspace.dependencies]
toml = "1.1"
